services:
  bold-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bold-migrate
    restart: unless-stopped
    ports:
      # Bound to loopback on purpose: Bold Migrate has no login UI and holds SSRS credentials,
      # Bold Reports admin tokens and SQL passwords. To reach it from another machine, put it
      # behind an authenticating reverse proxy AND set BoldMigrate__ApiAccessToken below.
      - "127.0.0.1:8085:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - BoldMigrate__StagingRootPath=/app/staging
      - BoldMigrate__DatabasePath=/app/data/boldmigrate.db
      - BoldMigrate__LogsPath=/app/logs
    volumes:
      - boldmigrate_data:/app/data
      - boldmigrate_staging:/app/staging
      - boldmigrate_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  boldmigrate_data:
  boldmigrate_staging:
  boldmigrate_logs:
