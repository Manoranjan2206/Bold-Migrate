<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bold Reports Headless Preview Runner</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link href="https://cdn.boldreports.com/15.1.17/content/v2.0/tailwind-light/bold.report-viewer.min.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--br-surface);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.boldreports.com/15.1.17/scripts/v2.0/common/bold.reports.common.min.js"></script>
  <script src="https://cdn.boldreports.com/15.1.17/scripts/v2.0/common/bold.reports.widgets.min.js"></script>
  <script src="https://cdn.boldreports.com/15.1.17/scripts/v2.0/bold.report-viewer.min.js"></script>
</head>
<body data-render-status="initializing">
  <div id="viewer"></div>

  <script>
    window.__renderStatus = 'initializing';
    window.__renderError = null;

    const urlParams = new URLSearchParams(window.location.search);
    const runId = urlParams.get('runId');
    const reportId = urlParams.get('reportId');
    const reportPath = urlParams.get('reportPath') || reportId;

    if (!runId || !reportPath) {
      document.body.setAttribute('data-render-status', 'error');
      window.__renderStatus = 'error';
      window.__renderError = 'Missing required runId or reportPath parameter.';
    } else {
      document.body.setAttribute('data-render-status', 'rendering');
      window.__renderStatus = 'rendering';

      try {
        $("#viewer").boldReportViewer({
          reportServiceUrl: "/api/preview/runs/" + encodeURIComponent(runId) + "/viewer",
          reportPath: reportPath,
          printMode: true,
          // Authoritative completion signal from the viewer itself. Preferred over the DOM
          // watcher below, which only exists because printMode can suppress this event.
          renderingComplete: function (args) {
            console.log("Bold Reports: Rendering complete", args);
            window.__renderStatus = 'complete';
            window.__renderCompleteSource = 'renderingComplete';
            document.body.setAttribute('data-render-status', 'complete');
          },
          renderingBegin: function () {
            // Proves the viewer actually started: distinguishes "slow report" from "never began".
            window.__renderBegan = true;
          },
          reportError: function (args) {
            let msg = 'Rendering failed';
            if (args) {
              let obj = args;
              if (typeof args === 'string' && args.trim().startsWith('{')) {
                try { obj = JSON.parse(args); } catch(e) { obj = args; }
              }
              if (typeof obj === 'string') {
                msg = obj;
              } else if (obj && typeof obj === 'object') {
                msg = obj.errmsg || obj.errdetail || (obj.error ? (typeof obj.error === 'string' ? obj.error : (obj.error.message || JSON.stringify(obj.error))) : null) || obj.message || JSON.stringify(obj);
              }
            }
            if (typeof msg === 'string' && (msg.includes('connection to SQL Server') || msg.includes('Named Pipes Provider') || msg.includes('network-related or instance-specific error'))) {
              msg = 'Data source offline: SQL Server connection could not be established in local preview.';
            }
            if (msg.length > 300) {
              msg = msg.substring(0, 297) + '...';
            }
            console.error("Bold Reports: Rendering error", msg);
            window.__renderStatus = 'error';
            window.__renderError = msg;
            document.body.setAttribute('data-render-status', 'error');
          },
          ajaxError: function (args) {
            console.error("Bold Reports: AJAX error", args);
            window.__renderStatus = 'error';
            window.__renderError = (args && (args.error || args.msg || args.statusText)) || 'Server communication error';
            document.body.setAttribute('data-render-status', 'error');
          }
        });
      } catch (ex) {
        console.error("Exception initializing Bold Report Viewer:", ex);
        window.__renderStatus = 'error';
        window.__renderError = ex.message || 'Initialization failed';
        document.body.setAttribute('data-render-status', 'error');
      }
    }

    // Completion detection.
    //
    // renderingComplete (https://help.boldreports.com/embedded-reporting/javascript-reporting/
    // report-viewer/api-reference/events/#renderingcomplete) is the authoritative signal and is
    // wired above — when it fires, we are done immediately and mark how we knew.
    //
    // It is not always raised with printMode:true, so this DOM-stability watcher is the fallback
    // only. It is deliberately stricter than before: it waits for the page container to hold real
    // content AND stop changing for several consecutive ticks, and it refuses to declare success
    // while the viewer is still showing its loading indicator — which is how a report could be
    // called "complete" before its data had actually arrived.
    (function () {
      var last = '', stable = 0;
      var REQUIRED_STABLE_TICKS = 4;   // ~2s of no DOM change
      var TICK_MS = 500;

      function viewerStillBusy() {
        // Bold Reports shows a waiting popup / spinner while a report is loading.
        var busy = document.querySelector(
          '.e-reportviewer-waitingpopup, .e-waitingpopup, .e-spinner-pane.e-spin-show, [id$="_waitingpopup"]'
        );
        if (!busy) return false;
        var cs = window.getComputedStyle(busy);
        return cs && cs.display !== 'none' && cs.visibility !== 'hidden';
      }

      setInterval(function () {
        if (document.body.getAttribute('data-render-status') !== 'rendering') return;
        if (viewerStillBusy()) { stable = 0; return; }

        var c = document.querySelector('[id$="_pageviewContainer"], .e-reportviewer-pageview');
        var sig = c ? c.querySelectorAll('*').length + ':' + (c.innerText || '').trim().length : '';
        var hasContent = c && (c.querySelectorAll('*').length > 5 || (c.innerText || '').trim().length > 20);

        if (hasContent && sig === last) { stable++; } else { stable = 0; }
        last = sig;

        if (stable >= REQUIRED_STABLE_TICKS) {
          window.__renderStatus = 'complete';
          window.__renderCompleteSource = 'dom-stable';
          document.body.setAttribute('data-render-status', 'complete');
        }
      }, TICK_MS);
    })();

    window.addEventListener('error', function (event) {
      if (window.__renderStatus !== 'complete') {
        console.warn("Uncaught script error during render:", event.message);
      }
    });
  </script>
</body>
</html>
